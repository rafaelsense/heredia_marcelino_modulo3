[project]
name="agente-logistico-log001"
version="0.1.0"
description="Agente de compromisos de entrega para el caso LOG-001"
requires-python=">=3.11"
dependencies=[
  "langgraph>=0.2",
  "openai-agents==0.0.17",
  "openai==2.9.0",
  "python-dotenv",
  "pydantic>=2.8",
  "typing-extensions>=4.12",
]

[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[dependency-groups]
dev=["pytest>=8"]

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra"
